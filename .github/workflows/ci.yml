name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly, for the scanners.
  #
  # `pnpm audit --prod` is a headline security gate, and on push/pull_request alone it can
  # only ever fire when someone happens to push. A high advisory published against a
  # dependency tree nobody has touched is exactly the case it exists for, and exactly the
  # case those triggers miss.
  #
  # The image scan in `image` is the same argument about the base image: Trivy fetches a
  # fresh vulnerability database on every run, so a CVE published against a Dockerfile
  # nobody has edited surfaces here rather than at the next deploy.
  schedule:
    - cron: "0 5 * * 1"

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared at workflow level rather than per job, so a job added later inherits the floor
# instead of silently taking the repository default. Nothing here writes: no job comments on
# a PR, pushes a tag or uploads a release. A check that needs a write scope belongs in its
# own workflow, where the wider grant is visible, rather than widening this one.
permissions:
  contents: read

env:
  # Placeholders. The build and the E2E fixture must not need real credentials —
  # if the env schema starts demanding them, that is a legitimate CI failure.
  RAILWAY_CLIENT_ID: e2e-client
  RAILWAY_CLIENT_SECRET: e2e-secret
  SESSION_SECRET: ci-session-secret-at-least-32-characters
  APP_URL: http://localhost:3000

jobs:
  quality:
    name: Format, lint, types, coverage
    runs-on: ubuntu-latest
    # Every job carries one. The default is six hours, and the jobs that can wedge rather
    # than fail — anything driving a browser at a stream that never closes — would sit
    # there for all of it while `required` waits on them.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `--prod` is deliberate, not a softening. Every advisory open today sits
      # under @lhci/cli, which never runs in a deployment — an unqualified
      # `--audit-level=high` would fail this build immediately on GHSA-ph9p-34f9-6g65
      # and train everyone to ignore the step. `--prod` re-evaluates reachability on
      # every run, which an ignore-list of advisory ids would not.
      - name: Dependency audit (shipped tree)
        run: pnpm audit --prod --audit-level=high

      # Advisory: surfaces dev-tree findings without gating the merge on tooling.
      - name: Dependency audit (full tree)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Prettier
        run: pnpm format:check

      - name: ESLint (zero warnings)
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      # The generated GraphQL types against the committed schema and the documents that
      # produced them. It runs here rather than in the `schema` job because it needs no
      # RAILWAY_TOKEN — `codegen.ts` reads src/lib/railway/schema.graphql, which is in git
      # for exactly this reason — and because a stale generated file is a typecheck that
      # passed against a shape Railway no longer has.
      #
      # `git diff --exit-code` is the assertion: regeneration must be a no-op. A document
      # edited without `pnpm codegen` fails here, and codegen itself fails first if the
      # document no longer validates.
      - name: GraphQL codegen is current
        run: pnpm codegen:check

      # Unused files, dependencies and exports. Findings fail; they are not advisory.
      - name: knip (dead code)
        run: pnpm knip

      # Fails the job if any threshold in vitest.config.mts is missed.
      - name: Unit, component and integration tests with coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Next 16 no longer prints route sizes, so this is the only thing standing
      # between a stray import and a silently heavier page.
      - name: Per-route bundle budget
        run: pnpm size

      # A few kB of manifest, not the 100+ MB .next tree. Without it a budget failure
      # cannot be diffed after the fact — the run tells you a route grew and the evidence
      # is discarded with the runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: route-bundle-stats
          path: .next/diagnostics/route-bundle-stats.json
          retention-days: 7

  browser:
    name: End-to-end, accessibility and Lighthouse
    runs-on: ubuntu-latest
    # One job, because both halves need the same install, the same production build, the
    # same chromium and the same fake Railway. Splitting them paid for all four twice —
    # roughly three minutes of duplicated setup per run — to gain no isolation worth
    # having, since a broken build fails both anyway.
    #
    # Rejected: keeping them apart and sharing `.next` as an artifact. That is 100+ MB up
    # and down, which costs more than the rebuild it saves and couples the two jobs'
    # failure modes through a cache instead of through a build.
    #
    # workers:1 by design, and the Lighthouse run drives a real browser at /dashboard,
    # whose SSE stream never closes — so the ceiling covers both and is generous.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Both Playwright projects run on the Chromium engine, and lh-auth.ts drives the
      # real OAuth flow with Playwright too, so one browser serves the whole job.
      #
      # The install stays unconditional. It is idempotent — it skips a browser already in
      # the cache directory — and it has to run regardless for the system libraries, which
      # `path` does not carry. It is also what makes `restore-keys` safe: a partial restore
      # can hand back a browser build that does not match the installed Playwright, and the
      # install is the step that notices and corrects it.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts `node .next/standalone/server.js`, which builds nothing
      # and does not exist until this step has run. A stale one would be served silently.
      - run: pnpm build

      # Runs against e2e/fixtures/fake-railway; no Railway credentials involved.
      # workers:1 is set in the config — the fixture holds shared state.
      - name: "Playwright (workers: 1)"
        run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Backgrounded because both servers must stay up for the whole Lighthouse run;
      # the script exits only on failure, and prints "ready" once both answer.
      #
      # The loop used to fall through on exhaustion, so a server that never answered left
      # this step green and surfaced two steps later as lh-auth failing to find a sign-in
      # link — which reads as an auth defect rather than a server that never started.
      - name: Start app and fake Railway
        run: |
          pnpm serve:e2e &
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "The app did not answer /api/health within 120s."
            exit 1
          fi

      # numberOfRuns is 1 in lighthouserc.cjs — one Chrome, never a pool.
      - name: Lighthouse CI
        run: pnpm lighthouse

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  image:
    name: Deployment image
    runs-on: ubuntu-latest
    # A cold `next build` inside Docker, plus a boot and a scan. Measured at roughly eight
    # minutes; the ceiling is generous because the alternative to a slow build here is a
    # failed build at Railway.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The three scanners run as digest-pinned images rather than as actions, for one
      # reason each and one shared one. gitleaks-action is proprietary and defaults to
      # commenting on pull requests, which needs a write scope this workflow says belongs
      # elsewhere; having the other two arrive by a different mechanism would leave three
      # tools with three shapes. The shared reason is that every command below runs
      # verbatim on a laptop, which is the same property the Dockerfile is chosen for.
      #
      # The cost is stated rather than hidden: Dependabot does not reach a digest inside a
      # `run:` step, so these three are bumped by hand. The trailing version comment is
      # what makes their age readable. It costs less than it looks — Trivy fetches its
      # vulnerability database at run time, so the gate stays current even when the image
      # pinned here does not.
      #
      # DL3059 (consecutive `RUN`s) is deliberate in that file: `pnpm size` reads
      # .next/diagnostics, which `pnpm build` writes, so the two cannot be one instruction
      # without losing the budget failure's own exit code. DL3066 wants a numeric UID, and
      # `node` is the name Alpine's image ships — a number would be a guess at what that
      # name resolves to.
      - name: hadolint
        run: |
          # ghcr.io/hadolint/hadolint:v2.15.1-alpine
          docker run --rm --interactive \
            ghcr.io/hadolint/hadolint@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 \
            hadolint --no-color --failure-threshold info \
            --ignore DL3059 --ignore DL3066 - < Dockerfile

      # No cache, deliberately. A warm build here can pass while the cold build Railway
      # runs fails, and cold is the thing this job exists to prove. It is also what makes
      # `--frozen-lockfile` and the inline build credentials mean anything: both are
      # assertions about a build starting from nothing.
      - name: Build
        run: docker build --tag railway-freight-loader:ci .

      # The build proves the image compiles. Only this proves it boots — a COPY that was
      # never added, a CMD that reaches for a package manager the runtime stage does not
      # have. Both build clean and fail at Railway as "Healthcheck failure", which names
      # nothing.
      #
      # `--env NAME` with no value forwards the runner's, so the four placeholders at the
      # top of this file reach the container without being restated here.
      #
      # `docker logs` runs before the failure branch and unconditionally: the boot records
      # are the diagnostic, and `boot.env_invalid` is exactly what a misconfigured image
      # writes. The loop sets `ready` rather than falling through, for the reason the
      # browser job's equivalent records — an exhausted loop that exits 0 leaves this step
      # green and surfaces later as something that reads like a different defect.
      - name: Boot it
        run: |
          docker run --detach --name smoke --publish 3000:3000 \
            --env RAILWAY_CLIENT_ID --env RAILWAY_CLIENT_SECRET \
            --env SESSION_SECRET \
            railway-freight-loader:ci
          ready=0
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health)" = 200 ]; then
              ready=1; break
            fi
            sleep 2
          done
          docker logs smoke
          docker rm --force smoke
          if [ "$ready" != 1 ]; then
            echo "The image did not answer /api/health within 60s."
            exit 1
          fi

      # Scanned from a tarball rather than through a mounted Docker socket. The socket is
      # root on the runner, and handing that to a third-party container to inspect an image
      # it can read from a file is not a trade worth making for the convenience.
      #
      # `--ignore-unfixed` for the same reason `pnpm audit` is scoped to `--prod`: a gate
      # that reports a CVE with no available fix is a gate that is red for reasons no
      # commit can address, and a permanently red gate is one everybody learns to skip.
      # `pnpm audit --prod` covers the JavaScript tree; this covers the operating system
      # layer and anything else the image carries that the lockfile does not describe.
      - name: Trivy
        run: |
          docker save railway-freight-loader:ci --output image.tar
          # ghcr.io/aquasecurity/trivy:0.73.0
          docker run --rm --volume "$PWD:/work" --workdir /work \
            ghcr.io/aquasecurity/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --input image.tar --no-progress --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because the scan below reads history, not the checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # CodeQL does not do this, and nothing else here did. The whole history, every run:
      # SECURITY.md claims no secret has ever been committed and that claim was verified by
      # hand, once. `--log-opts=--all` is what turns it into something that stays true —
      # and it covers a force-push that rewrites a commit into a branch nobody reads.
      #
      # This gate arrives while the repository is clean, which is the only time a secret
      # scanner is prevention rather than an incident report. It found nothing across 72
      # commits when it was added.
      #
      # `--redact` because a finding is printed into a public log. The rule and the file are
      # what an operator needs; the matched bytes are what an attacker needs.
      #
      # GIT_CONFIG_* because the container runs as root against a workspace owned by the
      # runner user, and git refuses to read a repository it thinks belongs to somebody
      # else. Passed as environment so nothing is written into the checkout being scanned.
      - name: gitleaks
        run: |
          # ghcr.io/gitleaks/gitleaks:v8.30.1
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts=--all --redact --no-banner .

  schema:
    name: Railway schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Two halves, one of which is new. It checks the pinned OIDC metadata against
      # Railway's live discovery document, and validates every document in operations.ts
      # against the committed schema — nested fields, arguments, enum values and variable
      # types included. Comparing that committed copy against the *live* schema needs
      # RAILWAY_TOKEN, which CI does not hold.
      - run: pnpm verify:schema

  # Single stable check name for branch protection to require.
  required:
    name: All checks
    runs-on: ubuntu-latest
    needs: [quality, build, browser, image, secrets, schema]
    if: always()
    timeout-minutes: 5
    steps:
      # Two assertions, because either alone is passable by a job that never ran.
      #
      # This used to fail only on 'failure' or 'cancelled', so a job skipped by a future
      # `if:` condition — or dropped from `needs` in a bad merge — left branch protection
      # green with nothing behind it. Requiring 'success' to be present catches the empty
      # case; rejecting 'skipped' catches the partly-empty one.
      #
      # Neither catches a job that was never added to `needs` at all, because from here it
      # is indistinguishable from a job that does not exist. src/toolchain.test.ts derives
      # the list below from the jobs this file defines and fails when the two disagree.
      - name: Fail unless every check succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'success') }}" != "true" ]; then
            echo "No check reported success."
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more checks failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All checks passed."
