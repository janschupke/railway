name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly, for the dependency audit.
  #
  # `pnpm audit --prod` is a headline security gate, and on push/pull_request alone it can
  # only ever fire when someone happens to push. A high advisory published against a
  # dependency tree nobody has touched is exactly the case it exists for, and exactly the
  # case those triggers miss.
  schedule:
    - cron: "0 5 * * 1"

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared at workflow level rather than per job, so a job added later inherits the floor
# instead of silently taking the repository default. Nothing here writes: no job comments on
# a PR, pushes a tag or uploads a release. A check that needs a write scope belongs in its
# own workflow, where the wider grant is visible, rather than widening this one.
permissions:
  contents: read

env:
  # Placeholders. The build and the E2E fixture must not need real credentials —
  # if the env schema starts demanding them, that is a legitimate CI failure.
  RAILWAY_CLIENT_ID: e2e-client
  RAILWAY_CLIENT_SECRET: e2e-secret
  SESSION_SECRET: ci-session-secret-at-least-32-characters
  APP_URL: http://localhost:3000

jobs:
  quality:
    name: Format, lint, types, coverage
    runs-on: ubuntu-latest
    # Every job carries one. The default is six hours, and the jobs that can wedge rather
    # than fail — anything driving a browser at a stream that never closes — would sit
    # there for all of it while `required` waits on them.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `--prod` is deliberate, not a softening. The three advisories open today all sit
      # under @lhci/cli, which never runs in a deployment — an unqualified
      # `--audit-level=high` would fail this build immediately on GHSA-ph9p-34f9-6g65
      # and train everyone to ignore the step. `--prod` re-evaluates reachability on
      # every run, which an ignore-list of advisory ids would not.
      - name: Dependency audit (shipped tree)
        run: pnpm audit --prod --audit-level=high

      # Advisory: surfaces dev-tree findings without gating the merge on tooling.
      - name: Dependency audit (full tree)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Prettier
        run: pnpm format:check

      - name: ESLint (zero warnings)
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      # Unused files, dependencies and exports. Findings fail; they are not advisory.
      - name: knip (dead code)
        run: pnpm knip

      # Fails the job if any threshold in vitest.config.mts is missed.
      - name: Unit, component and integration tests with coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Next 16 no longer prints route sizes, so this is the only thing standing
      # between a stray import and a silently heavier page.
      - name: Per-route bundle budget
        run: pnpm size

      # A few kB of manifest, not the 100+ MB .next tree. Without it a budget failure
      # cannot be diffed after the fact — the run tells you a route grew and the evidence
      # is discarded with the runner.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: route-bundle-stats
          path: .next/diagnostics/route-bundle-stats.json
          retention-days: 7

  browser:
    name: End-to-end, accessibility and Lighthouse
    runs-on: ubuntu-latest
    # One job, because both halves need the same install, the same production build, the
    # same chromium and the same fake Railway. Splitting them paid for all four twice —
    # roughly three minutes of duplicated setup per run — to gain no isolation worth
    # having, since a broken build fails both anyway.
    #
    # Rejected: keeping them apart and sharing `.next` as an artifact. That is 100+ MB up
    # and down, which costs more than the rebuild it saves and couples the two jobs'
    # failure modes through a cache instead of through a build.
    #
    # workers:1 by design, and the Lighthouse run drives a real browser at /dashboard,
    # whose SSE stream never closes — so the ceiling covers both and is generous.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Both Playwright projects run on the Chromium engine, and lh-auth.ts drives the
      # real OAuth flow with Playwright too, so one browser serves the whole job.
      #
      # The install stays unconditional. It is idempotent — it skips a browser already in
      # the cache directory — and it has to run regardless for the system libraries, which
      # `path` does not carry. It is also what makes `restore-keys` safe: a partial restore
      # can hand back a browser build that does not match the installed Playwright, and the
      # install is the step that notices and corrects it.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts `next start`, so the app must be built first.
      - run: pnpm build

      # Runs against e2e/fixtures/fake-railway; no Railway credentials involved.
      # workers:1 is set in the config — the fixture holds shared state.
      - name: "Playwright (workers: 1)"
        run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Backgrounded because both servers must stay up for the whole Lighthouse run;
      # the script exits only on failure, and prints "ready" once both answer.
      #
      # The loop used to fall through on exhaustion, so a server that never answered left
      # this step green and surfaced two steps later as lh-auth failing to find a sign-in
      # link — which reads as an auth defect rather than a server that never started.
      - name: Start app and fake Railway
        run: |
          pnpm serve:e2e &
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "The app did not answer /api/health within 120s."
            exit 1
          fi

      # numberOfRuns is 1 in lighthouserc.cjs — one Chrome, never a pool.
      - name: Lighthouse CI
        run: pnpm lighthouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  schema:
    name: Railway schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Checks the pinned OIDC metadata against Railway's live discovery document.
      # Full schema introspection needs RAILWAY_TOKEN, which CI does not hold.
      - run: pnpm verify:schema

  # Single stable check name for branch protection to require.
  required:
    name: All checks
    runs-on: ubuntu-latest
    needs: [quality, build, browser, schema]
    if: always()
    timeout-minutes: 5
    steps:
      # Two assertions, because either alone is passable by a job that never ran.
      #
      # This used to fail only on 'failure' or 'cancelled', so a job skipped by a future
      # `if:` condition — or dropped from `needs` in a bad merge — left branch protection
      # green with nothing behind it. Requiring 'success' to be present catches the empty
      # case; rejecting 'skipped' catches the partly-empty one.
      - name: Fail unless every check succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'success') }}" != "true" ]; then
            echo "No check reported success."
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more checks failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All checks passed."
