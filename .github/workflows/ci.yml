name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders. The build and the E2E fixture must not need real credentials —
  # if the env schema starts demanding them, that is a legitimate CI failure.
  RAILWAY_CLIENT_ID: e2e-client
  RAILWAY_CLIENT_SECRET: e2e-secret
  SESSION_SECRET: ci-session-secret-at-least-32-characters
  APP_URL: http://localhost:3000

jobs:
  quality:
    name: Format, lint, types, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint (zero warnings)
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      # Fails the job if any threshold in vitest.config.mts is missed.
      - name: Unit, component and integration tests with coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only chromium is configured, so only chromium is downloaded.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts `next start`, so the app must be built first.
      - run: pnpm build

      # Runs against e2e/fixtures/fake-railway; no Railway credentials involved.
      # workers:1 is set in the config — the fixture holds shared state.
      - name: "Playwright (workers: 1)"
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  schema:
    name: Railway schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Checks the pinned OIDC metadata against Railway's live discovery document.
      # Full schema introspection needs RAILWAY_TOKEN, which CI does not hold.
      - run: pnpm verify:schema

  # Single stable check name for branch protection to require.
  required:
    name: All checks
    runs-on: ubuntu-latest
    needs: [quality, build, e2e, schema]
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more checks failed."
            exit 1
          fi
          echo "All checks passed."
